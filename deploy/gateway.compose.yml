name: regstead-gateway
services:
  ingress:
    image: caddy:2
    environment:
      REGSTEAD_STAGING_HOST: ${REGSTEAD_STAGING_HOST:?Set the approved staging hostname}
      REGSTEAD_PRODUCTION_HOST: ${REGSTEAD_PRODUCTION_HOST:?Set the approved production hostname}
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./Caddyfile.m16-2:/etc/caddy/Caddyfile:ro
      - tls:/data
      - caddy-config:/config
    networks:
      staging-edge:
        ipv4_address: 172.30.15.254
      production-edge:
        ipv4_address: 172.30.16.254
    restart: unless-stopped
volumes:
  tls:
    name: regstead-staging_tls
    external: true
  caddy-config:
    name: regstead-staging_caddy-config
    external: true
networks:
  staging-edge:
    name: regstead-staging-edge
    external: true
  production-edge:
    name: regstead-production-edge
    external: true
